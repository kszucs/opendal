[package]
name = "opendal-cpp"
publish = false

authors = ["Apache OpenDAL <dev@opendal.apache.org>"]
edition = "2024"
homepage = "https://opendal.apache.org/"
license = "Apache-2.0"
repository = "https://github.com/apache/opendal"
rust-version = "1.91"

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = { version = "1.0.100" }
bytes = { version = "1.11.0", optional = true }
cxx = { version = "1.0.186" }
cxx-async = { version = "0.1.3", optional = true }
futures = { version = "0.3.31" }
mea = "0.6"
# this crate won't be published, we always use the local version
opendal = { version = ">=0", path = "../../core", features = ["blocking"] }
tokio = { version = "1.27", features = ["fs", "macros", "rt-multi-thread"] }

[build-dependencies]
cxx-build = { version = "1.0.186" }

[features]
async = ["cxx-async", "cxx/c++20"]
testing = ["dep:bytes"]
# Service features are forwarded to the core crate so that a caller can select
# backends through this crate's own feature list (and hence through CMake's
# OPENDAL_FEATURES) rather than having to depend on opendal directly. Without
# these, passing e.g. -DOPENDAL_FEATURES=services-s3 fails outright, because
# this crate declares no such feature to forward.
#
# fs and memory need no network, which is what makes them usable from tests.
services-azblob = ["opendal/services-azblob"]
services-fs = ["opendal/services-fs"]
services-gcs = ["opendal/services-gcs"]
services-hf = ["opendal/services-hf"]
services-http = ["opendal/services-http"]
services-memory = ["opendal/services-memory"]
services-s3 = ["opendal/services-s3"]
